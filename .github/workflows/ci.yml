name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

# kiro-secops installer quality gate:
#   test          — unit tests (race + coverage) + guard self-test (Ubuntu)
#   test-cross-os — tests on macOS and Windows (no race: requires a C toolchain on Windows)
#   go-analysis   — gofmt + go vet + golangci-lint (standard Go)
#   vuln          — govulncheck (reachable vulnerabilities in stdlib/deps)
#   yaml          — yamllint + actionlint + goreleaser check (existing YAML files)
# Build/cross-compile is an inert TEMPLATE in examples/build/ (enable it in your fork).
# This sample does NOT publish releases; the release pipeline is an inert TEMPLATE in
# examples/release/ (enable it in your fork).
# Actions pinned by commit SHA (supply chain, A08); updates via Dependabot.
jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache: false # stdlib+yaml.v3: no large go.sum to cache
      - name: Tests (race + coverage)
        run: go test ./... -race -covermode=atomic -coverprofile=coverage.out
      - name: Coverage (summary)
        run: go tool cover -func=coverage.out | tail -1
      - name: Guard self-test
        run: go run ./cmd/kiro-secops verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out

  test-cross-os:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache: false
      # No -race: the detector requires a C toolchain, absent by default on the Windows runner.
      # The goal here is to exercise the filesystem/rename paths on a real OS.
      - name: Tests
        run: go test ./...

  go-analysis:
    name: Go code analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache: false
      - name: gofmt
        run: |
          out="$(gofmt -l cmd internal)"
          test -z "$out" || { echo "gofmt: unformatted files:"; echo "$out"; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: Consistent vendor (hermetic build)
        run: |
          go mod vendor
          git diff --exit-code -- vendor go.mod go.sum \
            || { echo "vendor/ out of date: run 'go mod vendor' and commit"; exit 1; }
      - name: golangci-lint (pinned, via go install/GOSUMDB)
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          "$(go env GOPATH)/bin/golangci-lint" run ./...

  vuln:
    name: Vulnerabilities (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache: false
      - name: govulncheck (pinned)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  yaml:
    name: YAML analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache: false
      - name: yamllint
        run: |
          pipx install "yamllint==1.38.0"
          yamllint -c .yamllint.yml .
      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          bin="$(go env GOPATH)/bin/actionlint"
          "$bin" -color
          "$bin" -color internal/assets/payload/workspace/github/workflows/security-scan.yml
          "$bin" -color examples/build/build.yml
          "$bin" -color examples/release/release.yml
      - name: goreleaser check
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: check
